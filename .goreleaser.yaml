# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: another
builds:
  - id: another
    main: ./cmd/another
    binary: another
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nxxxsooo/another/internal/cli.version={{.Version}}
archives:
  - formats: [tar.gz]
    # Windows gets zips: tar.gz needs a third-party unpacker there, while
    # Expand-Archive handles zips out of the box — which is what
    # scripts/install.ps1 relies on.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
# Casks, because goreleaser deprecated `brews`. Casks are no longer macOS-only:
# Homebrew ships Linux implementations of caskroom, quarantine, installer, and
# trash, and Cask::DSL includes OnSystem::MacOSAndLinux, so the generated
# on_macos/on_linux blocks both resolve. Homebrew therefore covers every
# platform this project builds for.
#
# GITHUB_TOKEN cannot write to a repository outside this one, so the tap needs
# its own fine-grained token with contents:write on the tap alone.
#
# Verified with `goreleaser check`, `brew style --cask`, and `brew audit --cask`
# against a scratch tap. Deprecations surface only at runtime, never in the
# JSON schema, so `goreleaser check` is the gate before every release.
homebrew_casks:
  - name: another
    repository:
      owner: nxxxsooo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/nxxxsooo/another"
    # Under 80 characters, or `brew style` flags Cask/Desc.
    description: "Browse and manage coding-agent sessions, or move one into another agent"
    license: MIT
    binaries: [another]
    # These binaries are unsigned, so Homebrew quarantines them on download and
    # Gatekeeper kills the first run. Verified on a scratch tap: without this
    # the staged binary carries com.apple.quarantine, with it the attribute is
    # gone before the first run.
    #
    # Written as a custom block rather than through `hooks.post.install`,
    # because goreleaser renders that hook as `postflight`, which Homebrew now
    # deprecates in favour of `postflight_steps` — and prints a warning on every
    # `brew upgrade` telling the user to report it to this tap. There is no
    # declarative step for removing quarantine, so this is `run` with paths
    # resolved the way the step DSL resolves them: chdir and writable_paths are
    # relative to the staged path. must_succeed is false so a machine without
    # xattr still installs, which is what the old hook's `xattr -h` guard did.
    #
    # goreleaser emits custom_block directly after `cask ... do`, which puts
    # this stanza before `version` and makes `brew style` report every stanza as
    # out of order. That is the trade: a lint only this repository ever runs, in
    # exchange for a deprecation warning every user saw on every upgrade.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr",
            args:           ["-dr", "com.apple.quarantine", "another"],
            chdir:          ".",
            writable_paths: ["another"],
            must_succeed:   false
      end
    zap:
      trash:
        # Only on `brew uninstall --zap`. These are the two directories another
        # creates; native agent sessions are never touched. Alphabetical, or
        # `brew style` flags Cask/ArrayAlphabetization.
        - "~/.cache/another"
        - "~/.config/another"

checksum:
  name_template: checksums.txt

# A release page is read by someone deciding whether to upgrade, so it opens
# with how to upgrade and then says what changed in their terms. `use: github`
# takes the commit subjects GitHub already associates with the tag; the filters
# drop the housekeeping that means nothing to a user, and the groups put the
# two questions they actually have — what is new, what is fixed — first.
changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\([[:word:]]+\))??!?:'
      - '^chore(\([[:word:]]+\))??!?:'
      - '^ci(\([[:word:]]+\))??!?:'
      - '^test(\([[:word:]]+\))??!?:'
      - '^style(\([[:word:]]+\))??!?:'
      - '^refactor(\([[:word:]]+\))??!?:'
      - '^Merge '

release:
  header: |
    ## Install

    ```bash
    brew install nxxxsooo/tap/another
    ```

    Already installed:

    ```bash
    brew upgrade another
    ```

    Or download the archive for your platform below and verify it against `checksums.txt`.
